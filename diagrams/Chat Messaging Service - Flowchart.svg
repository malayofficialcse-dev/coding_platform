<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2100" viewBox="0 0 1500 2100">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/></marker><style>.box{fill:#e3f1ff;stroke:#c6d7e5;stroke-width:2}.txt{font:600 20px Arial;fill:#3297f5}.small{font:600 17px Arial;fill:#3297f5}.line{stroke:#888;stroke-width:2;fill:none;marker-end:url(#a)}.dot{fill:#f8fbff;stroke:#3297f5;stroke-width:2;stroke-dasharray:5 5}.db{fill:#e3f1ff;stroke:#c6d7e5;stroke-width:2}</style></defs>
<rect width="1500" height="2100" fill="#fafafa"/>
<g class="txt" text-anchor="middle">
<rect class="box" x="480" y="35" width="300" height="72" rx="24"/><text x="630" y="80">React messages UI</text>
<rect class="box" x="525" y="145" width="210" height="72" rx="24"/><text x="630" y="190">API Gateway</text>
<rect class="box" x="140" y="275" width="300" height="72" rx="24"/><text x="290" y="320">/v1/messages</text>
<rect class="box" x="1050" y="275" width="320" height="72" rx="24"/><text x="1210" y="320">/socket.io proxy</text>
<rect class="dot" x="125" y="405" width="330" height="75" rx="24"/><text x="290" y="450">Message routes</text>
<rect class="box" x="1020" y="405" width="380" height="75" rx="24"/><text x="1210" y="450">Socket.IO server</text>
<rect class="box" x="45" y="540" width="330" height="80" rx="24"/><text x="210" y="588">Get conversation sidebar</text>
<rect class="box" x="430" y="540" width="300" height="80" rx="24"/><text x="580" y="588">Get messages with user</text>
<rect class="box" x="790" y="540" width="270" height="80" rx="24"/><text x="925" y="588">Send message</text>
