<rect class="box" x="450" y="690" width="260" height="80" rx="24"/><text x="580" y="738">Verify JWT</text>
<rect class="box" x="780" y="690" width="300" height="80" rx="24"/><text x="930" y="725"><tspan x="930">Validate receiver</tspan><tspan x="930" dy="24">and text / image</tspan></text>
<rect class="dot" x="1160" y="690" width="240" height="80" rx="24"/><text x="1280" y="738">Image supplied?</text>
<rect class="box" x="20" y="840" width="360" height="80" rx="24"/><text x="200" y="875"><tspan x="200">User Service</tspan><tspan x="200" dy="24">contacts response</tspan></text>
<rect class="box" x="450" y="840" width="260" height="80" rx="24"/><text x="580" y="888">Load messages</text>
<rect class="box" x="780" y="840" width="300" height="80" rx="24"/><text x="930" y="875"><tspan x="930">Upload image to</tspan><tspan x="930" dy="24">Cloudinary</tspan></text>
<rect class="box" x="1160" y="840" width="240" height="80" rx="24"/><text x="1280" y="875"><tspan x="1280">No image:</tspan><tspan x="1280" dy="24">keep text</tspan></text>
<rect class="box" x="450" y="990" width="260" height="80" rx="24"/><text x="580" y="1038">Conversation history</text>
<rect class="box" x="780" y="990" width="300" height="80" rx="24"/><text x="930" y="1038">Find / create conversation</text>
<rect class="box" x="780" y="1140" width="300" height="80" rx="24"/><text x="930" y="1188">Create Message document</text>
<rect class="db" x="510" y="1270" width="220" height="100" rx="30"/><ellipse class="db" cx="620" cy="1270" rx="110" ry="24"/><text x="620" y="1328">Chat MongoDB</text>
<rect class="box" x="780" y="1300" width="300" height="80" rx="24"/><text x="930" y="1348">Update lastMessage</text>
<rect class="box" x="780" y="1450" width="300" height="80" rx="24"/><text x="930" y="1498">Emit newMessage</text>
<rect class="box" x="1130" y="1450" width="300" height="80" rx="24"/><text x="1280" y="1485"><tspan x="1280">Publish notification</tspan><tspan x="1280" dy="24">event</tspan></text>
<rect class="db" x="1180" y="1600" width="200" height="95" rx="28"/><ellipse class="db" cx="1280" cy="1600" rx="100" ry="22"/><text x="1280" y="1655">RabbitMQ</text>
<rect class="box" x="1100" y="1760" width="360" height="80" rx="24"/><text x="1280" y="1808">Notification Service</text>
<rect class="box" x="520" y="1760" width="300" height="80" rx="24"/><text x="670" y="1808">Recipient chat UI</text>
<rect class="box" x="520" y="1910" width="300" height="80" rx="24"/><text x="670" y="1958">GET history when needed</text>
