<g class="edgeText"><text x="1340" y="445">Yes</text><text x="1180" y="545">No → error</text><text x="1370" y="1115">No / by providerId</text><text x="950" y="1295">Yes</text><text x="1490" y="1295">By email</text><text x="470" y="1760">INSERT / UPDATE</text><text x="1220" y="1835">Set-Cookie</text></g>
</svg>
