version: '3.8'

networks:
  code-campus-net:
    driver: bridge

volumes:
  auth-pg-data:
  mentor-pg-data:
  user-pg-data:
  enrollment-pg-data:
  exam-pg-data:
  coding-pg-data:
  post-mongo-data:
  course-mongo-data:
  coding-mongo-data:
  chat-mongo-data:
  notification-mongo-data:
  neo4j-data:
  redis-data:
  ai-chroma-data:

# ========================================================
# DATABASES
# ========================================================

services:

  # ---- PostgreSQL Instances ----
  postgres-auth:
    image: postgres:16-alpine
    container_name: cc-postgres-auth
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: cc_auth
      POSTGRES_PASSWORD: cc_auth_pass
    ports:
      - "5431:5432"
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    networks:
      - code-campus-net

  postgres-mentor:
    image: postgres:16-alpine
    container_name: cc-postgres-mentor
    restart: always
    environment:
      POSTGRES_DB: mentor_db
      POSTGRES_USER: cc_mentor
      POSTGRES_PASSWORD: cc_mentor_pass
    ports:
      - "5440:5432"
    volumes:
      - mentor-pg-data:/var/lib/postgresql/data
    networks:
      - code-campus-net

  postgres-user:
    image: postgres:16-alpine
    container_name: cc-postgres-user
    restart: always
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: cc_user
      POSTGRES_PASSWORD: cc_user_pass
    ports:
      - "5433:5432"
    volumes:
      - user-pg-data:/var/lib/postgresql/data
    networks:
      - code-campus-net

  postgres-enrollment:
    image: postgres:16-alpine
    container_name: cc-postgres-enrollment
    restart: always
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: cc_enrollment
      POSTGRES_PASSWORD: cc_enrollment_pass
    ports:
      - "5434:5432"
    volumes:
      - enrollment-pg-data:/var/lib/postgresql/data
    networks:
      - code-campus-net

  postgres-exam:
    image: postgres:16-alpine
    container_name: cc-postgres-exam
    restart: always
    environment:
      POSTGRES_DB: exam_db
      POSTGRES_USER: cc_exam
      POSTGRES_PASSWORD: cc_exam_pass
    ports:
      - "5435:5432"
    volumes:
      - exam-pg-data:/var/lib/postgresql/data
    networks:
      - code-campus-net

  postgres-coding:
    image: postgres:16-alpine
    container_name: cc-postgres-coding
    restart: always
    environment:
      POSTGRES_DB: coding_db
      POSTGRES_USER: cc_coding
      POSTGRES_PASSWORD: cc_coding_pass
    ports:
      - "5436:5432"
    volumes:
      - coding-pg-data:/var/lib/postgresql/data
    networks:
      - code-campus-net

  # ---- MongoDB Instances (scoped per service) ----
  mongo-post:
    image: mongo:7
    container_name: cc-mongo-post
    restart: always
    environment:
      MONGO_INITDB_DATABASE: post_db
    ports:
      - "27017:27017"
    volumes:
      - post-mongo-data:/data/db
    networks:
      - code-campus-net

  mongo-course:
    image: mongo:7
    container_name: cc-mongo-course
    restart: always
    environment:
      MONGO_INITDB_DATABASE: course_db
    ports:
      - "27018:27017"
    volumes:
      - course-mongo-data:/data/db
    networks:
      - code-campus-net

  mongo-coding:
    image: mongo:7
    container_name: cc-mongo-coding
    restart: always
    environment:
      MONGO_INITDB_DATABASE: coding_problems_db
    ports:
      - "27019:27017"
    volumes:
      - coding-mongo-data:/data/db
    networks:
      - code-campus-net

  mongo-chat:
    image: mongo:7
    container_name: cc-mongo-chat
    restart: always
    environment:
      MONGO_INITDB_DATABASE: chat_db
    ports:
      - "27020:27017"
    volumes:
      - chat-mongo-data:/data/db
    networks:
      - code-campus-net

  mongo-notification:
    image: mongo:7
    container_name: cc-mongo-notification
    restart: always
    environment:
      MONGO_INITDB_DATABASE: notification_db
    ports:
      - "27021:27017"
    volumes:
      - notification-mongo-data:/data/db
    networks:
      - code-campus-net

  # ---- Neo4j (Social Graph) ----
  neo4j:
    image: neo4j:5-community
    container_name: cc-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/cc_neo4j_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
    networks:
      - code-campus-net

  # ---- Redis (Cache + Rate Limiting + Socket.IO) ----
  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - code-campus-net

  # ========================================================
  # API GATEWAY
  # ========================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: code-campus-gateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      - API_GATEWAY_PORT=5000
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - CLIENT_ORIGINS=${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:5001
      - USER_SERVICE_URL=http://user-service:5002
      - POST_SERVICE_URL=http://post-service:5003
      - EXAM_SERVICE_URL=http://exam-service:5004
      - COURSE_SERVICE_URL=http://course-service:5005
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:5006
      - CODING_SERVICE_URL=http://coding-service:5007
      - NOTIFICATION_SERVICE_URL=http://notification-service:5008
      - CHAT_SERVICE_URL=http://chat-service:5009
      - MENTOR_SERVICE_URL=http://mentor-service:5010
    depends_on:
      - redis
      - auth-service
      - mentor-service
      - user-service
      - post-service
      - exam-service
      - course-service
      - enrollment-service
      - coding-service
      - notification-service
      - chat-service
    networks:
      - code-campus-net

  # ========================================================
  # AUTH SERVICE → PostgreSQL auth_db
  # ========================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: code-campus-auth
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5001
      - AUTH_DATABASE_URL=postgres://cc_auth:cc_auth_pass@postgres-auth:5432/auth_db
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-10m}
      - REFRESH_TOKEN_IDLE_DAYS=${REFRESH_TOKEN_IDLE_DAYS:-7}
      - REFRESH_TOKEN_ABSOLUTE_DAYS=${REFRESH_TOKEN_ABSOLUTE_DAYS:-30}
      - REFRESH_COOKIE_SAME_SITE=${REFRESH_COOKIE_SAME_SITE:-none}
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-true}
      - CLIENT_ORIGINS=${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:5000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set a strong random INTERNAL_SERVICE_TOKEN in the microservice backend .env file}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - postgres-auth
    networks:
      - code-campus-net

  # ========================================================
  # USER SERVICE → PostgreSQL user_db + Neo4j
  # ========================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: code-campus-user
    restart: always
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - USER_DATABASE_URL=postgres://cc_user:cc_user_pass@postgres-user:5433/user_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cc_neo4j_pass
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://codecamp:codecamp-dev-password@host.docker.internal:5672}
    depends_on:
      - postgres-user
      - neo4j
      - redis
    networks:
      - code-campus-net

  # ========================================================
  # POST SERVICE → MongoDB post_db
  # ========================================================
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: code-campus-post
    restart: always
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - POST_MONGO_URI=mongodb://mongo-post:27017/post_db
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://codecamp:codecamp-dev-password@host.docker.internal:5672}
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongo-post
    networks:
      - code-campus-net

  # ========================================================
  # EXAM SERVICE → PostgreSQL exam_db
  # ========================================================
  exam-service:
    build:
      context: ./exam-service
      dockerfile: Dockerfile
    container_name: code-campus-exam
    restart: always
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - EXAM_DATABASE_URL=postgres://cc_exam:cc_exam_pass@postgres-exam:5435/exam_db
    depends_on:
      - postgres-exam
    networks:
      - code-campus-net

  # ========================================================
  # COURSE SERVICE → MongoDB course_db
  # ========================================================
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: code-campus-course
    restart: always
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - COURSE_MONGO_URI=mongodb://mongo-course:27018/course_db
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongo-course
    networks:
      - code-campus-net

  # ========================================================
  # ENROLLMENT SERVICE → PostgreSQL enrollment_db
  # ========================================================
  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: code-campus-enrollment
    restart: always
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - ENROLLMENT_DATABASE_URL=postgres://cc_enrollment:cc_enrollment_pass@postgres-enrollment:5434/enrollment_db
      - COURSE_SERVICE_URL=http://course-service:5005
    depends_on:
      - postgres-enrollment
    networks:
      - code-campus-net

  # ========================================================
  # CODING SERVICE → PostgreSQL coding_db + MongoDB coding_problems_db
  # ========================================================
  coding-service:
    build:
      context: ./coding-service
      dockerfile: Dockerfile
    container_name: code-campus-coding
    restart: always
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - CODING_DATABASE_URL=postgres://cc_coding:cc_coding_pass@postgres-coding:5436/coding_db
      - CODING_MONGO_URI=mongodb://mongo-coding:27019/coding_problems_db
      - ENABLE_LOCAL_EXEC=${ENABLE_LOCAL_EXEC}
      - PISTON_URL=${PISTON_URL}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY}
      - JUDGE0_API_HOST=${JUDGE0_API_HOST}
      - JUDGE0_API_URL=${JUDGE0_API_URL}
    depends_on:
      - postgres-coding
      - mongo-coding
    networks:
      - code-campus-net

  # ========================================================
  # NOTIFICATION SERVICE → MongoDB notification_db
  # ========================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: code-campus-notification
    restart: always
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - NOTIFICATION_MONGO_URI=mongodb://mongo-notification:27021/notification_db
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://codecamp:codecamp-dev-password@host.docker.internal:5672}
      - CHAT_SERVICE_URL=http://chat-service:5009
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set a strong random INTERNAL_SERVICE_TOKEN in the microservice backend .env file}
    depends_on:
      - mongo-notification
      - chat-service
    networks:
      - code-campus-net

  # ========================================================
  # CHAT SERVICE → MongoDB chat_db
  # ========================================================
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: code-campus-chat
    restart: always
    ports:
      - "5009:5009"
    environment:
      - PORT=5009
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - CHAT_MONGO_URI=mongodb://mongo-chat:27020/chat_db
      - NOTIFICATION_SERVICE_URL=http://notification-service:5008
      - USER_SERVICE_URL=http://user-service:5002
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://codecamp:codecamp-dev-password@host.docker.internal:5672}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set a strong random INTERNAL_SERVICE_TOKEN in the microservice backend .env file}
    depends_on:
      - mongo-chat
      - redis
      - user-service
    networks:
      - code-campus-net

  # ========================================================
  # MENTOR SERVICE — mentor approval, sessions, chat, polls
  # ========================================================
  mentor-service:
    build:
      context: ./mentor-service
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5010
      - MENTOR_DATABASE_URL=postgres://cc_mentor:cc_mentor_pass@postgres-mentor:5432/mentor_db
      - AUTH_SERVICE_URL=http://auth-service:5001
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set a strong random INTERNAL_SERVICE_TOKEN in the microservice backend .env file}
      - CLIENT_ORIGINS=${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    depends_on:
      - postgres-mentor
      - auth-service
      - redis
    networks:
      - code-campus-net

  # ========================================================
  # AI SERVICE — RAG Chatbot (LangGraph + ChromaDB)
  # ========================================================
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: code-campus-ai
    restart: always
    ports:
      - "5011:5011"
    environment:
      - PORT=5011
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-code-campus-ai}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - COURSE_MONGO_URI=mongodb://mongo-course:27018/course_db
      - CODING_MONGO_URI=mongodb://mongo-coding:27019/coding_problems_db
      - EXAM_DATABASE_URL=postgres://cc_exam:cc_exam_pass@postgres-exam:5432/exam_db
      - USER_SERVICE_URL=http://user-service:5002
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:5006
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set a strong random INTERNAL_SERVICE_TOKEN in the microservice backend .env file}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters in the microservice backend .env file}
      - CLIENT_ORIGINS=${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ai-chroma-data:/app/chroma_db
    depends_on:
      - mongo-course
      - mongo-coding
      - user-service
    networks:
      - code-campus-net

