version: '3.8'

networks:
  code-campus-net:
    driver: bridge

services:
  # ========================================================
  # API GATEWAY (Central Client Entrypoint)
  # ========================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: code-campus-gateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      - API_GATEWAY_PORT=5000
      - JWT_SECRET=kweu249hp72hf4fh48g7w9f4wpef74
      - AUTH_SERVICE_URL=http://auth-service:5001
      - USER_SERVICE_URL=http://user-service:5002
      - POST_SERVICE_URL=http://post-service:5003
      - EXAM_SERVICE_URL=http://exam-service:5004
      - COURSE_SERVICE_URL=http://course-service:5005
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:5006
      - CODING_SERVICE_URL=http://coding-service:5007
      - NOTIFICATION_SERVICE_URL=http://notification-service:5008
      - CHAT_SERVICE_URL=http://chat-service:5009
    depends_on:
      - auth-service
      - user-service
      - post-service
      - exam-service
      - course-service
      - enrollment-service
      - coding-service
      - notification-service
      - chat-service
    networks:
      - code-campus-net

  # ========================================================
  # AUTH SERVICE
  # ========================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: code-campus-auth
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - PORT=5001
    networks:
      - code-campus-net

  # ========================================================
  # USER SERVICE
  # ========================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: code-campus-user
    restart: always
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      - PORT=5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5008
    networks:
      - code-campus-net

  # ========================================================
  # POST & DASHBOARD SERVICE
  # ========================================================
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: code-campus-post
    restart: always
    ports:
      - "5003:5003"
    env_file:
      - .env
    environment:
      - PORT=5003
      - NOTIFICATION_SERVICE_URL=http://notification-service:5008
    networks:
      - code-campus-net

  # ========================================================
  # EXAM SERVICE
  # ========================================================
  exam-service:
    build:
      context: ./exam-service
      dockerfile: Dockerfile
    container_name: code-campus-exam
    restart: always
    ports:
      - "5004:5004"
    env_file:
      - .env
    environment:
      - PORT=5004
    networks:
      - code-campus-net

  # ========================================================
  # COURSE SERVICE
  # ========================================================
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: code-campus-course
    restart: always
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      - PORT=5005
    networks:
      - code-campus-net

  # ========================================================
  # ENROLLMENT SERVICE
  # ========================================================
  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: code-campus-enrollment
    restart: always
    ports:
      - "5006:5006"
    env_file:
      - .env
    environment:
      - PORT=5006
      - COURSE_SERVICE_URL=http://course-service:5005
    networks:
      - code-campus-net

  # ========================================================
  # CODING SERVICE
  # ========================================================
  coding-service:
    build:
      context: ./coding-service
      dockerfile: Dockerfile
    container_name: code-campus-coding
    restart: always
    ports:
      - "5007:5007"
    env_file:
      - .env
    environment:
      - PORT=5007
    networks:
      - code-campus-net

  # ========================================================
  # NOTIFICATION SERVICE
  # ========================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: code-campus-notification
    restart: always
    ports:
      - "5008:5008"
    env_file:
      - .env
    environment:
      - PORT=5008
    networks:
      - code-campus-net

  # ========================================================
  # CHAT & REAL-TIME SOCKET SERVICE
  # ========================================================
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: code-campus-chat
    restart: always
    ports:
      - "5009:5009"
    env_file:
      - .env
    environment:
      - PORT=5009
      - NOTIFICATION_SERVICE_URL=http://notification-service:5008
    networks:
      - code-campus-net
