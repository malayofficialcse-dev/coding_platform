<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Code Campus Mentor Service Architecture</title>
  <desc id="desc">Detailed architecture showing client, API gateway, JWT authorization, mentor service workflows, PostgreSQL, Redis Socket.IO, LiveKit, Auth Service integration, and LiveKit webhooks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="mentor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f6f8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14213d" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4568e8"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15956b"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17243a} .title{font-size:34px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:15px;fill:#64748b}.h{font-size:17px;font-weight:700}.body{font-size:13px;fill:#475569}.small{font-size:11px;fill:#64748b}.mono{font-family:Consolas,monospace;font-size:11px;fill:#334155}.card{fill:#fff;stroke:#dbe3ef;stroke-width:1.2;rx:16;filter:url(#shadow)}.inner{fill:#fff;stroke:#dbe3ef;stroke-width:1;rx:11}.blue{fill:#edf2ff;stroke:#cad6ff}.green{fill:#eaf8f2;stroke:#bce8d5}.orange{fill:#fff3e9;stroke:#ffd2ad}.purple{fill:#f3edff;stroke:#dbcaff}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.lineBlue{fill:none;stroke:#4568e8;stroke-width:2.4;marker-end:url(#arrowBlue)}.lineGreen{fill:none;stroke:#15956b;stroke-width:2.4;marker-end:url(#arrowGreen)}.dash{stroke-dasharray:7 6}.tag{font-size:11px;font-weight:700;fill:#334155}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="url(#bg)"/>
  <text x="58" y="62" class="title">Mentor Service · Code Campus</text>
  <text x="60" y="91" class="subtitle">Request flow, roles, persistence, realtime room events, and video integration</text>
  <rect x="1430" y="40" width="310" height="34" rx="17" fill="#eaf8f2" stroke="#bce8d5"/>
  <circle cx="1450" cy="57" r="6" fill="#18a875"/><text x="1465" y="61" class="tag">CURRENT MICROSERVICE IMPLEMENTATION</text>

  <!-- Client and gateway -->
  <g>
    <rect x="60" y="125" width="300" height="154" class="card"/>
    <rect x="60" y="125" width="8" height="154" rx="4" fill="#61dafb"/>
    <circle cx="96" cy="159" r="16" fill="#e9faff" stroke="#8de6f7"/>
    <ellipse cx="96" cy="159" rx="12" ry="5" fill="none" stroke="#1497bd" stroke-width="1.5"/>
    <ellipse cx="96" cy="159" rx="12" ry="5" fill="none" stroke="#1497bd" stroke-width="1.5" transform="rotate(60 96 159)"/>
    <ellipse cx="96" cy="159" rx="12" ry="5" fill="none" stroke="#1497bd" stroke-width="1.5" transform="rotate(120 96 159)"/>
    <text x="124" y="165" class="h">React client</text>
    <text x="84" y="199" class="body">Mentorship, discovery, admin review,</text><text x="84" y="218" class="body">and MentorRoom UI</text>
    <rect x="84" y="237" width="119" height="24" rx="12" fill="#e9faff"/><text x="97" y="253" class="tag">React · Vite</text>
    <rect x="210" y="237" width="126" height="24" rx="12" fill="#f1f5f9"/><text x="222" y="253" class="tag">LiveKit Client SDK</text>
  </g>
  <g>
    <rect x="430" y="125" width="360" height="154" class="card"/>
    <rect x="430" y="125" width="8" height="154" rx="4" fill="#64748b"/>
    <path d="M466 148h32l9 10v22h-41z" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/><path d="M498 148v11h9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="520" y="165" class="h">API Gateway · Express</text>
    <text x="454" y="199" class="body">HTTP proxy: <tspan class="mono">/api/mentor/* → :5010</tspan></text>
    <text x="454" y="218" class="body">WebSocket proxy: <tspan class="mono">/mentor-socket.io</tspan></text>
    <rect x="454" y="237" width="115" height="24" rx="12" fill="#f1f5f9"/><text x="468" y="253" class="tag">JWT header decode</text>
    <rect x="578" y="237" width="105" height="24" rx="12" fill="#fff3e9"/><text x="592" y="253" class="tag">HTTP proxy</text>
  </g>
  <g>
    <rect x="865" y="125" width="275" height="154" class="card"/>
    <rect x="865" y="125" width="8" height="154" rx="4" fill="#1677c8"/>
    <path d="M899 146l15 6v12c0 10-7 16-15 20-8-4-15-10-15-20v-12z" fill="#e7f3ff" stroke="#1677c8" stroke-width="1.5"/><path d="M892 163l5 5 10-11" fill="none" stroke="#1677c8" stroke-width="2"/>
    <text x="928" y="165" class="h">Auth Service</text>
    <text x="889" y="199" class="body">Source of account roles and JWTs</text>
    <text x="889" y="218" class="body">Private role-grant endpoint</text>
    <rect x="889" y="237" width="190" height="24" rx="12" fill="#e7f3ff"/><text x="902" y="253" class="tag">PostgreSQL · Internal token</text>
  </g>
  <path d="M360 199H422" class="lineBlue"/><text x="371" y="188" class="small">HTTPS / REST</text>
  <path d="M790 199H857" class="lineBlue"/><text x="792" y="188" class="small">/api/mentor</text>
  <path d="M865 246C830 310 820 320 785 360" class="line dash"/><text x="803" y="304" class="small">approval calls Auth privately</text>

  <!-- Main service boundary -->
  <rect x="60" y="330" width="1080" height="744" rx="22" fill="url(#mentor)" stroke="#b9c8ed" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="60" y="330" width="1080" height="62" rx="22" fill="#243b76"/>
  <rect x="60" y="372" width="1080" height="20" fill="#243b76"/>
  <circle cx="94" cy="361" r="17" fill="#fff" opacity=".16"/><text x="86" y="367" font-size="16" font-weight="800" fill="#fff">M</text>
  <text x="124" y="358" font-size="20" font-weight="750" fill="#fff">MENTOR SERVICE · Node.js 22 + Express 4</text>
  <text x="124" y="379" font-size="12" fill="#d9e3ff">Port 5010 · authenticates JWT itself · owns mentor domain data</text>
  <rect x="863" y="347" width="240" height="29" rx="14" fill="#fff" opacity=".16"/><text x="881" y="366" font-size="11" font-weight="700" fill="#fff">Express · pg · axios · Socket.IO</text>

  <!-- Request pipeline -->
  <rect x="88" y="418" width="1018" height="93" class="inner"/>
  <text x="108" y="445" class="h">1 · Shared request pipeline</text>
  <rect x="108" y="461" width="180" height="32" rx="8" class="blue"/><text x="124" y="482" class="tag">CORS origin policy</text>
  <path d="M290 477h26" class="line"/>
  <rect x="320" y="461" width="195" height="32" rx="8" class="blue"/><text x="338" y="482" class="tag">Verify Bearer JWT</text>
  <path d="M517 477h26" class="line"/>
  <rect x="547" y="461" width="220" height="32" rx="8" class="blue"/><text x="565" y="482" class="tag">Build req.user from claims</text>
  <path d="M769 477h26" class="line"/>
  <rect x="799" y="461" width="275" height="32" rx="8" class="green"/><text x="817" y="482" class="tag">Route handler + PostgreSQL pool</text>

  <!-- Domain workflows -->
  <rect x="88" y="535" width="480" height="244" class="inner"/>
  <rect x="88" y="535" width="480" height="43" rx="11" fill="#edf2ff" stroke="#cad6ff"/>
  <text x="108" y="563" class="h">2 · Mentor application and approval</text>
  <text x="110" y="605" class="body">Applicant · <tspan class="mono">GET /me</tspan> · <tspan class="mono">POST /applications</tspan></text>
  <text x="110" y="627" class="small">Validate expertise, years (0–60), bio (≥30 chars); approved users cannot reapply.</text>
  <path d="M128 646v17" class="line"/>
  <rect x="110" y="666" width="191" height="45" rx="8" class="blue"/><text x="125" y="685" class="tag">UPSERT application</text><text x="125" y="700" class="small">status = pending</text>
  <path d="M304 688h26" class="line"/>
  <rect x="334" y="666" width="210" height="45" rx="8" class="purple"/><text x="349" y="685" class="tag">Super-admin decision</text><text x="349" y="700" class="small">approve / reject + review note</text>
  <text x="110" y="747" class="small">Approve → internal Auth role grant → persist decision → emit update event.</text>

  <rect x="592" y="535" width="514" height="244" class="inner"/>
  <rect x="592" y="535" width="514" height="43" rx="11" fill="#eaf8f2" stroke="#bce8d5"/>
  <text x="612" y="563" class="h">3 · Session scheduling and enrollment</text>
  <text x="614" y="605" class="body">Mentor: <tspan class="mono">POST /sessions</tspan> · learner: <tspan class="mono">POST /sessions/:id/enroll</tspan></text>
  <text x="614" y="627" class="small">Validate format, future time, duration (15–240 min), and participant capacity.</text>
  <rect x="614" y="650" width="136" height="48" rx="8" class="blue"/><text x="628" y="670" class="tag">Create session</text><text x="628" y="686" class="small">unique room name</text>
  <path d="M753 674h23" class="line"/>
  <rect x="780" y="650" width="146" height="48" rx="8" class="green"/><text x="793" y="670" class="tag">Lock session row</text><text x="793" y="686" class="small">BEGIN transaction</text>
  <path d="M929 674h23" class="line"/>
  <rect x="956" y="650" width="129" height="48" rx="8" class="orange"/><text x="969" y="670" class="tag">Capacity check</text><text x="969" y="686" class="small">insert enrollment</text>
  <text x="614" y="735" class="small">Duplicate enrollment is handled; full or unavailable sessions are rejected.</text>

  <rect x="88" y="803" width="480" height="234" class="inner"/>
  <rect x="88" y="803" width="480" height="43" rx="11" fill="#fff3e9" stroke="#ffd2ad"/>
  <text x="108" y="831" class="h">4 · Secure video join and session end</text>
  <text x="110" y="874" class="body">Client: <tspan class="mono">POST /sessions/:id/join-token</tspan></text>
  <text x="110" y="896" class="small">Check LiveKit config → session state → host/enrollment → allowed join window.</text>
  <path d="M127 911v15" class="line"/>
  <rect x="110" y="932" width="194" height="43" rx="8" class="blue"/><text x="125" y="950" class="tag">Create LiveKit room</text><text x="125" y="966" class="small">capacity + room settings</text>
  <path d="M307 953h24" class="line"/>
  <rect x="335" y="932" width="209" height="43" rx="8" class="orange"/><text x="350" y="950" class="tag">Mint 15-minute JWT</text><text x="350" y="966" class="small">publish grants depend on role/format</text>
  <text x="110" y="1007" class="small">Host ends room → LiveKit delete → persist ended status → notify room.</text>

  <rect x="592" y="803" width="514" height="234" class="inner"/>
  <rect x="592" y="803" width="514" height="43" rx="11" fill="#f3edff" stroke="#dbcaff"/>
  <text x="612" y="831" class="h">5 · Durable room chat and polls</text>
  <text x="614" y="874" class="body">REST: message history / poll list · Socket.IO: session chat and live events</text>
  <rect x="614" y="895" width="204" height="49" rx="8" class="blue"/><text x="628" y="915" class="tag">Authenticate socket JWT</text><text x="628" y="932" class="small">verify session membership</text>
  <path d="M821 920h24" class="line"/>
  <rect x="849" y="895" width="229" height="49" rx="8" class="green"/><text x="863" y="915" class="tag">Persist, then broadcast</text><text x="863" y="932" class="small">room-scoped events · rate limited</text>
  <text x="614" y="972" class="small">Mentor creates polls; enrolled learners vote; aggregated results broadcast.</text>
  <text x="614" y="997" class="small">Redis adapter enables events across multiple service instances.</text>

  <!-- Database -->
  <g>
    <rect x="1210" y="359" width="520" height="428" class="card"/>
    <rect x="1210" y="359" width="520" height="58" rx="16" fill="#eaf8f2" stroke="#bce8d5"/>
    <rect x="1210" y="400" width="520" height="17" fill="#eaf8f2"/>
    <ellipse cx="1250" cy="384" rx="19" ry="8" fill="#336791"/><path d="M1231 384v18c0 5 9 9 19 9s19-4 19-9v-18" fill="#dceefa" stroke="#336791" stroke-width="1.5"/><path d="M1231 393c0 5 9 9 19 9s19-4 19-9" fill="none" stroke="#336791" stroke-width="1.5"/>
    <text x="1285" y="390" class="h">PostgreSQL · pg</text>
    <text x="1236" y="443" class="body">Mentor-owned relational database</text>
    <rect x="1236" y="463" width="468" height="47" rx="8" class="inner"/><text x="1252" y="483" class="tag">mentor_applications</text><text x="1252" y="499" class="small">applicant profile · status · reviewer · audit note</text>
    <rect x="1236" y="519" width="468" height="47" rx="8" class="inner"/><text x="1252" y="539" class="tag">mentor_sessions</text><text x="1252" y="555" class="small">schedule · format · capacity · room · lifecycle status</text>
    <rect x="1236" y="575" width="468" height="47" rx="8" class="inner"/><text x="1252" y="595" class="tag">mentor_enrollments</text><text x="1252" y="611" class="small">unique session/user · status · join/leave timestamps</text>
    <rect x="1236" y="631" width="468" height="47" rx="8" class="inner"/><text x="1252" y="651" class="tag">mentor_chat_messages</text><text x="1252" y="667" class="small">session-scoped durable messages</text>
    <rect x="1236" y="687" width="468" height="47" rx="8" class="inner"/><text x="1252" y="707" class="tag">mentor_polls · mentor_poll_votes</text><text x="1252" y="723" class="small">poll options · unique vote per learner</text>
    <text x="1236" y="763" class="small">Startup creates required tables/indexes; pg Pool handles queries.</text>
  </g>
  <path d="M1107 690H1199" class="lineGreen"/><text x="1121" y="679" class="small">SQL / transactions</text>
  <path d="M1107 914C1160 914 1155 758 1201 758" class="lineGreen"/>

  <!-- Realtime and LiveKit providers -->
  <g>
    <rect x="1210" y="825" width="250" height="173" class="card"/>
    <circle cx="1248" cy="865" r="20" fill="#fff0ee" stroke="#ffc6bf"/><path d="M1238 858h20v14h-20zM1242 854v4m12-4v4" fill="none" stroke="#d82c20" stroke-width="2"/><text x="1280" y="871" class="h">Redis</text>
    <text x="1234" y="909" class="body">Socket.IO Redis adapter</text>
    <text x="1234" y="930" class="body">Pub/sub across instances</text>
    <text x="1234" y="959" class="small">Production requires REDIS_URL.</text>
    <rect x="1234" y="970" width="194" height="17" rx="8" fill="#fff0ee"/><text x="1246" y="982" class="tag">redis · @socket.io/redis-adapter</text>
  </g>
  <g>
    <rect x="1490" y="825" width="240" height="173" class="card"/>
    <circle cx="1528" cy="865" r="20" fill="#fff2e8" stroke="#ffcfad"/><path d="M1518 858h9l7 7-7 7h-9l7-7z" fill="#f46a24"/><text x="1560" y="871" class="h">LiveKit</text>
    <text x="1514" y="909" class="body">SFU video rooms</text>
    <text x="1514" y="930" class="body">Short-lived access tokens</text>
    <text x="1514" y="959" class="small">API secret stays server-side.</text>
    <rect x="1514" y="970" width="190" height="17" rx="8" fill="#fff2e8"/><text x="1525" y="982" class="tag">livekit-server-sdk</text>
  </g>
  <path d="M1107 950C1162 950 1157 898 1201 898" class="line"/><text x="1122" y="938" class="small">Socket adapter</text>
  <path d="M1107 964C1300 1085 1415 1090 1510 1005" class="lineBlue"/><text x="1260" y="1065" class="small">room creation · token grant · end room</text>

  <!-- Webhook -->
  <rect x="1210" y="1030" width="520" height="147" class="card"/>
  <rect x="1210" y="1030" width="520" height="43" rx="15" fill="#fff3e9" stroke="#ffd2ad"/><rect x="1210" y="1058" width="520" height="15" fill="#fff3e9"/>
  <text x="1234" y="1058" class="h">6 · LiveKit webhook lifecycle sync</text>
  <text x="1234" y="1101" class="body">Signed webhook → verify with LiveKit API credentials → map room to session</text>
  <text x="1234" y="1124" class="small">room_started / room_finished → update session status and emit events</text>
  <text x="1234" y="1145" class="small">participant_joined / participant_left → update enrollment attendance timestamps</text>
  <path d="M1610 1005v17" class="lineBlue"/>
  <path d="M1210 1107C1163 1107 1166 1015 1107 1015" class="lineGreen dash"/>
  <text x="1080" y="1137" class="small">Persist webhook updates</text>

  <!-- Technology strip -->
  <rect x="60" y="1200" width="1670" height="76" rx="16" fill="#17243a"/>
  <text x="84" y="1230" font-size="12" font-weight="700" fill="#aebbd1">TECH STACK</text>
  <g font-size="13" font-weight="700" fill="#fff">
    <rect x="190" y="1216" width="112" height="38" rx="10" fill="#3c873a"/><text x="214" y="1240" fill="#fff">Node.js 22</text>
    <rect x="314" y="1216" width="102" height="38" rx="10" fill="#ffffff"/><text x="337" y="1240" fill="#17243a">Express 4</text>
    <rect x="428" y="1216" width="120" height="38" rx="10" fill="#336791"/><text x="448" y="1240" fill="#fff">PostgreSQL</text>
    <rect x="560" y="1216" width="62" height="38" rx="10" fill="#e8f4fb"/><text x="578" y="1240" fill="#336791">pg</text>
    <rect x="634" y="1216" width="117" height="38" rx="10" fill="#111827"/><text x="652" y="1240" fill="#fff">Socket.IO</text>
    <rect x="763" y="1216" width="93" height="38" rx="10" fill="#d82c20"/><text x="783" y="1240" fill="#fff">Redis</text>
    <rect x="868" y="1216" width="115" height="38" rx="10" fill="#f46a24"/><text x="886" y="1240" fill="#fff">LiveKit SDK</text>
    <rect x="995" y="1216" width="82" height="38" rx="10" fill="#1677c8"/><text x="1018" y="1240" fill="#fff">JWT</text>
    <rect x="1089" y="1216" width="83" height="38" rx="10" fill="#4b5563"/><text x="1109" y="1240" fill="#fff">Docker</text>
    <rect x="1184" y="1216" width="204" height="38" rx="10" fill="#f3f4f6"/><text x="1200" y="1240" fill="#17243a">Axios · dotenv · CORS</text>
  </g>
  <text x="84" y="1262" font-size="11" fill="#aebbd1">Solid arrows: primary request/data flow · Dashed arrows: async or cross-service integration · Roles are re-verified inside Mentor Service</text>
</svg>
