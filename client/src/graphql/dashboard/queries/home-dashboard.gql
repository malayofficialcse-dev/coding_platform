query HomeDashboard($first: Int = 10) {
  homeDashboard(first: $first) {
    posts {
      id
      _id
      text
      group
      createdAt
      video
      images
      codeBlocks
      author
      likes
      likedByMe
      reactions
      poll
      tags
      repostedFrom
      repostedPost
      comments {
        id
        _id
        text
        createdAt
        author {
          id
          _id
          name
          username
          profileImage
        }
      }
    }
    feedHasMore
    users {
      id
      _id
      name
      username
      profileImage
      followers
      isFollowing
    }
    recommendations {
      id
      _id
      name
      username
      profileImage
      followers
      isFollowing
      degree
      recommendationReason
    }
  }
}
